<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<title>Codebay</title>
		<style>
			/* Each themed variable is defined once as light-dark(light, dark). With no
	       data-theme attribute (the "auto" mode) `color-scheme: light dark` lets the
	       browser preference pick the value; an explicit choice pins color-scheme
	       below, which forces every light-dark() to that side.

	       Light is a pale LCD panel; dark is an amber-phosphor CRT. They are not
	       inverses of each other, which is why --ink is text ONLY — the structural
	       roles it used to double as (border, drop shadow, inverted chip) are the
	       four tokens below. Collapsing them again turns every panel bar, active
	       tab and drop shadow into a glowing near-white slab in dark mode. */
			:root {
				color-scheme: light dark;
				--bg: light-dark(#d7d8d2, #16130d);
				--bg-card: light-dark(#e7e8e2, #211d13);
				--ink: light-dark(#14150f, #e9e0cb);
				--ink-soft: light-dark(#45463e, #b8ac93);
				--ink-faint: light-dark(#7d7e74, #8a806c);
				/* Half-lit avatar LED — a true mid-tone sitting evenly between the off and on cells, so all three levels stay distinct even at tiny sizes. */
				--led-gray: light-dark(#6b6c62, #8d8875);
				--rule: light-dark(#20211a, #4a4132);
				--rule-soft: light-dark(#b9bab2, #332c1f);
				/* The .panel hairline. Distinct from --ink so it can stay a warm mid-tone
	           in dark rather than tracing every card in near-white. */
				--edge: light-dark(#14150f, #645741);
				/* The hard un-blurred offset block. Light casts it darker than the page;
	           dark can't — black on near-black is invisible — so there it becomes a
	           warm plate that stays a step under --edge, keeping outline-then-plate
	           reading order without the near-white glare it had before. */
				--shadow: light-dark(#14150f, #4a3f28);
				/* The inverted chip: active tabs, primary buttons, panel bars, filled
	           ticks. In dark this is where the amber lives. */
				--fill: light-dark(#14150f, #d9963a);
				--fill-ink: light-dark(#d7d8d2, #17130a);
				/* Modal scrim. Has to DARKEN whatever it covers, so it can't be derived
	           from --ink (near-white in dark) or --shadow (a warm mid-tone in dark). */
				--scrim: light-dark(rgba(20, 21, 15, 0.5), rgba(0, 0, 0, 0.66));
				--warn-bg: light-dark(#e4d98f, #43350f);
				/* Kept yellower than --fill in dark so a warning doesn't read as chrome. */
				--warn-line: light-dark(#9c8729, #cbb45a);
				--warn-ink: light-dark(#463b08, #f3e6ad);
				/* Glint lifting a code chip off --warn-bg — pale in both themes, since
	           mixing toward --warn-ink would darken the chip on the light side. */
				--warn-chip: light-dark(rgba(255, 255, 255, 0.35), rgba(243, 230, 173, 0.14));
				--ok-bg: light-dark(#8fbf6e, #23421a);
				--ok-line: light-dark(#4c7a2e, #6fa84a);
				--ok-ink: light-dark(#1c3110, #cdeab8);
				--danger: light-dark(#b23a2e, #e2564a);
				--danger-soft: light-dark(#e3c6c1, #4a231e);
				--screen-bg: light-dark(#0d0e0a, #100c04);
				--screen-ink: light-dark(#d8d9cf, #e8b055);
				--screen-line: light-dark(rgba(255, 255, 255, 0.04), rgba(232, 176, 85, 0.05));
				--attn-done: #22c55e;
				/* The "live" LED on an inverted chip. Green reads as a lit indicator on
		           light's near-black chip; on dark's amber one it clashes, so there it
		           drops to the chip's own ink (matches --fill-ink). */
				--live-dot: light-dark(#22c55e, #17130a);
				--attn-waiting: light-dark(#f59e0b, #ff7a2f);
				/* Softened in dark — a saturated blue is the one hue that fights the warm ground. */
				--info: light-dark(#388bfd, #6c9fd8);
				/* The pixel matrix. 2.5% white over a near-black ground is invisible, so
	           dark gets amber at double the alpha to read as a grid rather than noise. */
				--grid-line: light-dark(rgba(0, 0, 0, 0.025), rgba(217, 150, 58, 0.05));
				/* --attn-done at reduced opacity — reads correctly on both themes' track color. */
				--switch-on-bg: rgba(34, 197, 94, 0.32);
				/* The two dim levels, named so they stay consistent. Deliberately not
	           themed: at equal alpha, dark disabled text measures higher contrast
	           than light, so a dark-only boost would read as "enabled". */
				--dim: 0.4;
				--dim-panel: 0.5;
				--font-display: 'Doto Variable', 'JetBrains Mono Variable', monospace;
				--font-mono:
					'JetBrains Mono Variable', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
				--font-serif: var(--font-display);
				--font-sans: var(--font-mono);
			}
			:root[data-theme='light'] {
				color-scheme: light;
			}
			:root[data-theme='dark'] {
				color-scheme: dark;
			}
			* {
				box-sizing: border-box;
			}
			/* The whole theme is square — enforce it globally (covers third-party
         widgets like the toaster too). Intentional, not a workaround.
         Exclude Mochi's dev-only debug bar so it keeps its own styling. */
			*:not(#mochi-dev-toolbar):not(#mochi-dev-toolbar *) {
				border-radius: 0 !important;
			}
			/* Shared "panel" chrome — the bordered, drop-shadowed card look used
         throughout the app (health box, ports/log boxes, instance cards,
         dropdowns, modals, the UI showcase). A component can still override
         `box-shadow`/`border` locally (e.g. the folder-picker modal's bigger
         8px shadow) — Svelte's auto-scoping class gives any same-component
         rule higher specificity than this global one, so local overrides
         always win regardless of source order. */
			.panel {
				border: 1px solid var(--edge);
				box-shadow: 4px 4px 0 var(--shadow);
			}
			/* Shared header bar — the inverted label strip at the top of a panel. */
			.panel-bar {
				padding: 9px 14px;
				background: var(--fill);
				color: var(--fill-ink);
				font-family: var(--font-display);
				font-weight: 700;
				font-size: 12px;
				text-transform: uppercase;
				letter-spacing: 0.12em;
			}
			body {
				margin: 0;
				font-family: var(--font-sans);
				background: var(--bg);
				color: var(--ink);
				font-size: 14px;
				line-height: 1.55;
				min-height: 100vh;
				-webkit-font-smoothing: antialiased;
			}
			/* The faint pixel-grid matrix overlay lives on a viewport-fixed layer
			   so it rasters once and is never re-tiled as the page scrolls. The 4px
			   cell keeps the 1px lines sparse enough to avoid moiré against the
			   physical pixel grid under fractional display scaling. */
			body::before {
				content: '';
				position: fixed;
				inset: 0;
				z-index: -1;
				pointer-events: none;
				background:
					repeating-linear-gradient(0deg, var(--grid-line) 0 1px, transparent 1px 4px),
					repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px 4px);
			}
		</style>
		{{mochi.head}} {{mochi.css}}
	</head>
	<body>
		{{mochi.body}} {{mochi.script}}
	</body>
</html>
